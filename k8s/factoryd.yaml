apiVersion: v1
kind: ServiceAccount
metadata:
  name: factoryd
  namespace: factory
---
# Cluster scope holds only what cannot be namespaced: namespace create,
# delete and list, creating the RoleBinding that grants factoryd-task
# inside each task namespace, and deleting released cache volumes. RBAC
# cannot restrict create by name, so the ValidatingAdmissionPolicy below
# confines all of it to factory-agents-* (and the volumes to released
# ones of class factory-cache). It also lists the CronJobs and CNPG's
# ScheduledBackups, which the console's Resources page shows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd
rules:
- apiGroups: [""]
  resources: [namespaces]
  # get and patch: a project's namespaces are server-side applied with
  # their label (Task 65); the policy confines it to labelled ones
  verbs: [create, delete, list, get, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  verbs: [create, get, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  verbs: [bind]
  resourceNames: [factoryd-task, factoryd-project, factory-project-deployer]
- apiGroups: [""]
  resources: [persistentvolumes]
  verbs: [list, delete]
# the platform's rollouts, whose windows hold the alerts that fire in them
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [list]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [list]
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: [list]
- apiGroups: [postgresql.cnpg.io]
  resources: [scheduledbackups]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factoryd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factoryd
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
# Bound per task namespace by factoryd itself, never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd-task
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [create, delete, get]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [serviceaccounts, resourcequotas, limitranges, persistentvolumeclaims]
  verbs: [create]
- apiGroups: [""]
  # get: the CI reconciler reads the runner registration secret to
  # deregister it from Forgejo before reclaiming the namespace, still
  # confined per-namespace by the RoleBinding above.
  resources: [secrets]
  verbs: [create, get]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  # get, patch: the worker egress is read and server-side applied again
  # whenever it differs from what the task's leases admit
  verbs: [create, get, patch]
---
# Bound per project namespace by factoryd itself (Task 65): what
# registration keeps there, the Deployments the alerts endpoint reads, and
# the pods, ReplicaSets and events the deployment_health read answers from.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd-project
rules:
- apiGroups: [""]
  resources: [resourcequotas, limitranges, serviceaccounts, secrets]
  verbs: [get, create, patch]
# the staging secrets pass lists the Secrets Flux applied for the project
- apiGroups: [""]
  resources: [secrets]
  verbs: [list]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods, events]
  verbs: [get, list]
- apiGroups: [kustomize.toolkit.fluxcd.io]
  resources: [kustomizations]
  verbs: [get, create, patch]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [get, create, patch]
---
# deployment_health's reads alone, for a seed project's namespace, which no
# registration binds and which must not hand factoryd-project's Secrets to
# factoryd: factoryd's own here, the platform's and Forgejo's in the infra
# repository.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd-health
rules:
- apiGroups: [""]
  resources: [pods, events]
  verbs: [get, list]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factoryd-health
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factoryd-health
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
# What a project's Flux Kustomization applies with, as the namespace's flux
# account (ruling 157): the workload kinds a project deploys, nothing
# cluster-scoped, no RBAC, no Flux kind and no network policy (the
# namespace's default deny is factoryd's; policies add up, so one of the
# project's would widen it). admin and edit would not do: both aggregate
# Flux's kinds, and a Kustomization without an account runs with the
# controller's rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-project-deployer
rules:
- apiGroups: [""]
  resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [pods, pods/log, events, endpoints]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [apps]
  resources: [replicasets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters, databases, scheduledbackups, backups]
  verbs: [get, list, watch, create, update, patch, delete]
---
# Each project's Flux source and its read credential <project>-git (Task
# 65); the admission policy confines both to the project's own names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factoryd-projects
  namespace: flux-system
rules:
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [gitrepositories]
  verbs: [get, create, patch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factoryd-projects
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factoryd-projects
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
# The registry pull secret factoryd copies into each task namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factoryd
  namespace: factory
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
  resourceNames: [forgejo-registry]
---
# factoryd records each roll: the Deployments' images, Flux's apply time
# (managedFields) and their availability.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factoryd-rolls
  namespace: factory
rules:
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get]
  resourceNames: [factoryd, factory-gateway]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factoryd-rolls
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factoryd-rolls
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factoryd
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factoryd
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factoryd-task-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE, DELETE]
      resources: ["*"]
      scope: "*"
  matchConditions:
  - name: factoryd
    expression: request.userInfo.username == 'system:serviceaccount:factory:factoryd'
  # access reviews (kubectl auth can-i) are queries, not objects
  - name: not-a-review
    expression: "!(request.resource.group in ['authorization.k8s.io', 'authentication.k8s.io'])"
  variables:
  - name: kind
    expression: request.kind.kind
  - name: target
    # a cluster-scoped request (a PersistentVolume) has no namespace
    expression: "request.kind.kind != 'Namespace' ? (has(request.namespace) ? request.namespace : '') : request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  - name: task
    expression: variables.target.startsWith('factory-agents-')
  # a project's namespace (Task 65): created with factory/project and the
  # restricted pod security level, or updated keeping the label it had; a
  # namespace without the label (the cluster's) never gets it. A namespace
  # the infra repository labels for a seed project (factory, platform,
  # forgejo: ruling 180) carries factory/objects=seed and is never
  # factoryd's: it cannot update it, add the mark or take it off.
  - name: projectNamespace
    expression: >-
      variables.kind == 'Namespace' && !variables.task && request.operation != 'DELETE' &&
      has(object.metadata.labels) && 'factory/project' in object.metadata.labels &&
      !('factory/objects' in object.metadata.labels) &&
      'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
      object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted' &&
      (request.operation == 'CREATE' ||
       (has(oldObject.metadata.labels) && 'factory/project' in oldObject.metadata.labels &&
        !('factory/objects' in oldObject.metadata.labels) &&
        oldObject.metadata.labels['factory/project'] == object.metadata.labels['factory/project']))
  # inside a namespace carrying factory/project, not a seed project's
  - name: inProject
    expression: >-
      variables.kind != 'Namespace' && !variables.task && request.operation != 'DELETE' &&
      namespaceObject != null && has(namespaceObject.metadata.labels) &&
      'factory/project' in namespaceObject.metadata.labels &&
      !('factory/objects' in namespaceObject.metadata.labels)
  # a project's Flux source: labelled, named after its project, its
  # repository <project>/<project> on the factory's Forgejo read with the
  # project's own credential, nothing included from elsewhere, no proxy
  - name: projectSource
    expression: >-
      variables.kind == 'GitRepository' && request.namespace == 'flux-system' && request.operation != 'DELETE' &&
      has(object.metadata.labels) && 'factory/project' in object.metadata.labels &&
      object.metadata.name == object.metadata.labels['factory/project'] &&
      object.spec.url == 'https://git.aisoftwarefactory.world/' + object.metadata.name + '/' + object.metadata.name &&
      has(object.spec.secretRef) && object.spec.secretRef.name == object.metadata.name + '-git' &&
      !has(object.spec.include) && !has(object.spec.proxySecretRef) &&
      (request.operation == 'CREATE' ||
       (has(oldObject.metadata.labels) && 'factory/project' in oldObject.metadata.labels &&
        oldObject.metadata.labels['factory/project'] == object.metadata.labels['factory/project']))
  # a cache volume whose claim went with its task namespace (the
  # directory stays: the class retains it)
  - name: releasedCache
    expression: >-
      variables.kind == 'PersistentVolume' && request.operation == 'DELETE' &&
      has(oldObject.spec.storageClassName) && oldObject.spec.storageClassName == 'factory-cache' &&
      has(oldObject.status.phase) && oldObject.status.phase == 'Released'
  # that source's credential
  - name: projectGitSecret
    expression: >-
      variables.kind == 'Secret' && request.namespace == 'flux-system' && request.operation != 'DELETE' &&
      has(object.metadata.labels) && 'factory/project' in object.metadata.labels &&
      object.metadata.name == object.metadata.labels['factory/project'] + '-git' &&
      (!has(object.type) || object.type == 'Opaque')
  validations:
  - expression: variables.task || variables.projectNamespace || variables.inProject || variables.projectSource || variables.projectGitSecret || variables.releasedCache
    message: factoryd may only act in factory-agents-* namespaces, in its projects' namespaces, on its projects' Flux sources and on released cache volumes
  - expression: >-
      variables.task ? variables.kind in ['Namespace', 'RoleBinding', 'ResourceQuota', 'LimitRange', 'ServiceAccount', 'CiliumNetworkPolicy', 'Secret', 'Pod', 'PersistentVolumeClaim'] :
      variables.inProject ? variables.kind in ['RoleBinding', 'ResourceQuota', 'LimitRange', 'ServiceAccount', 'Secret', 'Kustomization', 'CiliumNetworkPolicy'] :
      true
    message: factoryd may not create this kind of object
  # bound by the class's provisioner, never to a volume of factoryd's choice
  - expression: >-
      variables.kind != 'PersistentVolumeClaim' || request.operation == 'DELETE' ||
      (object.metadata.name.startsWith('cache-') &&
       has(object.spec.storageClassName) && object.spec.storageClassName == 'factory-cache' &&
       !has(object.spec.volumeName) && !has(object.spec.selector) &&
       !has(object.spec.dataSource) && !has(object.spec.dataSourceRef))
    message: factoryd's claims are cache-* claims of class factory-cache, bound by the provisioner
  # a service account token would carry the account's rights (the flux
  # account's deployer role) past factoryd's own lockdown
  - expression: >-
      variables.kind != 'Secret' || request.operation == 'DELETE' ||
      !has(object.type) || object.type != 'kubernetes.io/service-account-token'
    message: factoryd may not mint service account tokens
  # the project's default deny is the one network policy factoryd keeps there
  - expression: variables.kind != 'CiliumNetworkPolicy' || !variables.inProject || object.metadata.name == 'project'
    message: a project namespace's one network policy is named project
  - expression: >-
      variables.kind != 'Namespace' || !variables.task || request.operation == 'DELETE' ||
      (has(object.metadata.labels) &&
       'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
       ('factory.ai/task' in object.metadata.labels) &&
       object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted')
    message: task namespaces must carry factory.ai/task and pod-security.kubernetes.io/enforce=restricted
  - expression: >-
      variables.kind != 'RoleBinding' || request.operation == 'DELETE' ||
      (object.roleRef.kind == 'ClusterRole' && has(object.subjects) && (
        (variables.task && object.roleRef.name == 'factoryd-task' &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'factoryd' && has(s.namespace) && s.namespace == 'factory')) ||
        (variables.inProject && object.roleRef.name == 'factoryd-project' &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'factoryd' && has(s.namespace) && s.namespace == 'factory')) ||
        (variables.inProject && object.roleRef.name == 'factory-project-deployer' &&
         object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'flux' && has(s.namespace) && s.namespace == request.namespace))))
    message: factoryd may only bind factoryd-task or factoryd-project to itself and factory-project-deployer to a project namespace's flux account
  # a project's Kustomization applies its own repository into its own
  # namespace as that namespace's flux account (ruling 157)
  - expression: >-
      variables.kind != 'Kustomization' || request.operation == 'DELETE' ||
      (has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'flux' &&
       has(object.spec.targetNamespace) && object.spec.targetNamespace == request.namespace &&
       object.spec.sourceRef.kind == 'GitRepository' && object.spec.sourceRef.namespace == 'flux-system' &&
       object.spec.sourceRef.name == namespaceObject.metadata.labels['factory/project'])
    message: a project Kustomization runs as its namespace's flux account, into that namespace, from its project's GitRepository
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor' &&
       has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
    message: sandbox pods must run under gVisor without an automounted API token
  # No pod factoryd creates (worker, CI runner) needs privileged
  # containers, added capabilities, hostPath volumes or host namespaces, so
  # these checks apply to every pod, whatever its labels or namespace.
  # runtimeClassName and automountServiceAccountToken are not re-checked
  # here: the rule above already requires both for every pod.
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (
        !(object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []) +
          (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
          .exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == true) &&
        !(object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []) +
          (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
          .exists(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
            has(c.securityContext.capabilities.add) && size(c.securityContext.capabilities.add) > 0) &&
        (!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))) &&
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      )
    message: pods may not have privileged containers, added capabilities, hostPath volumes, hostNetwork, hostPID or hostIPC
  # Effective, not per-field. A container's own runAsNonRoot or runAsUser
  # wins over the pod's; if the container sets neither, the pod's value
  # applies; if neither sets it, it counts as not proven non-root. Checked
  # across containers, initContainers and ephemeralContainers, for every
  # pod factoryd creates anywhere under factory-agents-*.
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (object.spec.containers +
       (has(object.spec.initContainers) ? object.spec.initContainers : []) +
       (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
      .all(c,
        (has(c.securityContext) && has(c.securityContext.runAsNonRoot)
          ? c.securityContext.runAsNonRoot
          : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot))
        &&
        !(has(c.securityContext) && has(c.securityContext.runAsUser)
          ? c.securityContext.runAsUser == 0
          : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) && object.spec.securityContext.runAsUser == 0))
      )
    message: every container, initContainer and ephemeralContainer must have an effective runAsNonRoot of true and an effective runAsUser other than 0 (container overrides pod)
  # A namespace without a LimitRange sets no default: without this rule a
  # pod that omits limits would run unbounded. Every pod factoryd creates
  # (runner.go, ci.go, gates.go) already sets both on every container and
  # initContainer, so this is the stop for a namespace that has none yet.
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (object.spec.containers +
       (has(object.spec.initContainers) ? object.spec.initContainers : []))
      .all(c, has(c.resources) && has(c.resources.limits) &&
        has(c.resources.limits.cpu) && has(c.resources.limits.memory))
    message: every container and initContainer of a task pod must set cpu and memory limits
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factoryd-task-namespaces
spec:
  policyName: factoryd-task-namespaces
  validationActions: [Deny]
---
# The class factory-cache reaches every project's cache directory by the
# claim's name, the factory's own CI cache included: only factoryd claims
# it, and only in the namespaces it makes for sessions and CI jobs. CREATE
# only: the class is immutable after it, and the binder updates claims.
# The beta annotation still selects a class.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factory-cache-claims
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["*"]
      operations: [CREATE]
      resources: [persistentvolumeclaims]
  validations:
  - expression: >-
      !((has(object.spec.storageClassName) && object.spec.storageClassName == 'factory-cache') ||
        (has(object.metadata.annotations) && 'volume.beta.kubernetes.io/storage-class' in object.metadata.annotations &&
         object.metadata.annotations['volume.beta.kubernetes.io/storage-class'] == 'factory-cache')) ||
      (request.userInfo.username == 'system:serviceaccount:factory:factoryd' && request.namespace.startsWith('factory-agents-'))
    message: only factoryd claims the class factory-cache, in its factory-agents-* namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factory-cache-claims
spec:
  policyName: factory-cache-claims
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factoryd
  namespace: factory
  labels: {app: factoryd}
spec:
  replicas: 1
  # one process: the heal pass, the settle loop, the CI spawner and the
  # timeline lock assume it; Recreate lets the stopping pod hand its
  # sessions over before the next one revokes their credentials
  strategy: {type: Recreate, rollingUpdate: null}
  selector: {matchLabels: {app: factoryd}}
  template:
    metadata:
      labels: {app: factoryd}
    spec:
      serviceAccountName: factoryd
      # the pause container is PID 1 and reaps the git helpers a killed git
      # call of the GitHub exports leaves; factoryd as PID 1 would keep them
      # as zombies
      shareProcessNamespace: true
      # room for the temporal worker's 120 s stop: running sessions stop
      # their workers gracefully (work in progress pushed), then clean up
      terminationGracePeriodSeconds: 150
      automountServiceAccountToken: true
      # every callee is named in full, so the first DNS query is the one the
      # egress policy admits; search-path expansions would be refused
      dnsConfig: {options: [{name: ndots, value: "1"}]}
      imagePullSecrets:
      - name: forgejo-registry
      containers:
      - name: factoryd
        # same image as the gateway; the deployment picks the other binary
        image: git.aisoftwarefactory.world/sf/factory-gateway@sha256:d3c5cd4f1dca89c694a2a297aa3b2ac26cd722c062b5358536c959108d1edf34
        command: [factoryd]
        ports: [{name: http, containerPort: 8080}, {name: console, containerPort: 8090}]
        env:
        # tool calls without a file change before the repetition trip: the
        # code's default 24 trips normal reading on a large card, and the
        # stuck rule then climbs it to the frontier tier (ruling 298)
        - name: SUPERVISE_READING_WITHOUT_WRITING
          value: "60"
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: username}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: password}}
        - name: FACTORYD_DATABASE_URL
          value: postgres://$(PGUSER):$(PGPASSWORD)@sf-cluster-rw.platform.svc.cluster.local:5432/gateway
        # in-cluster Forgejo: the public host resolves to the edge gateway, which the egress policy does not admit
        - name: FORGEJO_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        # the Forgejo site admin's login for registration (role factoryd);
        # plain HTTP in the cluster: Cilium's WireGuard encrypts pod traffic
        # between nodes
        - name: OPENBAO_URL
          value: http://openbao.platform.svc.cluster.local:8200
        - name: LITELLM_URL
          value: http://litellm.platform.svc.cluster.local:4000
        - name: FORGEJO_BOT_USER
          value: factory-agent
        - name: FORGEJO_BOT_PASSWORD
          valueFrom: {secretKeyRef: {name: forgejo-bot-creds, key: password}}
        - name: FORGEJO_CI_REGISTRAR_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-ci-registrar, key: token}}
        - name: FORGEJO_CI_ORG_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-ci-org-read, key: token}}
        # the Hetzner CI project's token (build VMs, ruling 110) and the
        # nodes' public IPv4s, the only sources a build VM admits (ruling 112)
        - name: HETZNER_CI_KEY
          valueFrom: {secretKeyRef: {name: hetzner-ci, key: token}}
        - name: CI_BUILD_VM_SOURCES
          valueFrom: {configMapKeyRef: {name: cluster-facts, key: node_public_ips}}
        # factory-merge: merge whitelist of main only; the workflow's Merge
        - name: FORGEJO_MERGE_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-merge, key: token}}
        # factory-gate: approvals whitelist of main only; the merge gate's
        # approval before a merge on the merge rule auto (ruling R59)
        - name: FORGEJO_GATE_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-gate, key: token}}
        # factory-chat: write collaborator on no whitelist; the project
        # agent's own identity in every turn no member started (the wake)
        - name: FORGEJO_CHAT_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-chat, key: token}}
        # factory-projects: owns every project organisation (ruling 164)
        # and keeps its repository's hooks, collaborators, protection,
        # deploy key, Actions secrets and runners; write:repository only
        - name: FORGEJO_PROJECTS_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-projects, key: token}}
        # factory-config: read collaborator on the infra repository only,
        # read:repository limited to it; factoryd reads the configuration
        # tree factory/ of its main with it every 30 s (ruling 183)
        - name: FORGEJO_CONFIG_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-config, key: token}}
        # factory-docs: write collaborator on the document repository
        # sf/ai-software-factory only, write:repository limited to it; the
        # chat's write_doc commits there with it (roadmap 239, the
        # 2026-10-13 plan); absent, write_doc says no token is seated
        - name: FORGEJO_DOCS_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-docs, key: token, optional: true}}
        # factoryd-messengers (roadmap 145): Telegram's bot key and
        # Discord's app, bot and guild; the secret may be absent and every
        # key may be empty, each absence seats no messenger
        - name: TELEGRAM_BOT_KEY
          valueFrom: {secretKeyRef: {name: factoryd-messengers, key: telegram_bot_key, optional: true}}
        - name: DISCORD_CLIENT_ID
          valueFrom: {secretKeyRef: {name: factoryd-messengers, key: discord_client_id, optional: true}}
        - name: DISCORD_CLIENT_SECRET
          valueFrom: {secretKeyRef: {name: factoryd-messengers, key: discord_client_secret, optional: true}}
        - name: DISCORD_BOT_TOKEN
          valueFrom: {secretKeyRef: {name: factoryd-messengers, key: discord_bot_token, optional: true}}
        # factory-registry-read: a read:package token, member of org sf's
        # team factory-registry-read (packages read, no repository); the
        # roller reads main CI's images with it and can overwrite no tag
        - name: REGISTRY_READ_USER
          value: factory-registry-read
        - name: REGISTRY_READ_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-registry-read, key: token}}
        # the public half of main CI's cosign key (roadmap 46): the roller
        # rolls only an image signed with it; a new key restarts factoryd
        - name: COSIGN_PUB
          valueFrom: {configMapKeyRef: {name: image-signing, key: cosign.pub}}
        # the public half of the images key (sandbox images), which signs
        # project images only: the imager pins and a pod runs only a project
        # image signed with it; a new key restarts factoryd
        - name: IMAGES_COSIGN_PUB
          valueFrom: {configMapKeyRef: {name: images-signing, key: images-cosign.pub}}
        # the repository holding the configuration tree factory/; every
        # other repository factoryd works on is named by a project file
        - name: CONFIG_REPO
          value: sf/ai-software-factory-infra
        # a SigNoz user with the viewer role: the SigNoz sweep reads the
        # firing alerts with it and can change nothing
        - name: SIGNOZ_EMAIL
          valueFrom: {secretKeyRef: {name: signoz-factoryd, key: email}}
        - name: SIGNOZ_PASSWORD
          valueFrom: {secretKeyRef: {name: signoz-factoryd, key: password}}
        # the basic auth of SigNoz's webhook channel factoryd (seeded, the
        # signoz-objects job reads its copy in platform)
        - name: SIGNOZ_WEBHOOK_PASSWORD
          valueFrom: {secretKeyRef: {name: signoz-webhook, key: password}}
        - name: CI_RUNNER_IMAGE
          value: git.aisoftwarefactory.world/sf/ci-runner@sha256:8d9e3823b9e696c993da166a26d73c4fd8fcdc5c84c08cac26c8ba25ff5eef25
        - name: LITELLM_MASTER_KEY
          valueFrom: {secretKeyRef: {name: litellm-master-key, key: masterkey}}
        - name: S3_ENDPOINT
          value: https://fsn1.your-objectstorage.com
        - name: S3_BUCKET
          value: aisoftwarefactory-sessions
        - name: S3_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: factory-s3-creds, key: access-key-id}}
        - name: S3_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: factory-s3-creds, key: secret-access-key}}
        - name: WORKER_IMAGE
          value: git.aisoftwarefactory.world/sf/opencode-worker@sha256:72798006b0c8bbaccdee70a8ff3f6fae17ff698a5b90ed978506f59877098681
        - name: SANDBOX_BASE_IMAGE
          value: git.aisoftwarefactory.world/sf/sandbox-base@sha256:1dce8bf640a9a038760f0ea253d5f27f8c2732eab69fc0cb21e2bd56946c3950
        - name: GATEWAY_URL
          value: http://factory-gateway.factory.svc.cluster.local:8081
        - name: INTAKE_TOKEN
          valueFrom: {secretKeyRef: {name: factoryd-intake, key: token}}
        # the gateway's bearer for POST /internal/escalations
        - name: GATEWAY_TOKEN
          valueFrom: {secretKeyRef: {name: gateway-factoryd, key: token}}
        - name: FORGEJO_WEBHOOK_SECRET
          valueFrom: {secretKeyRef: {name: factoryd-webhook, key: secret}}
        # the console's Forgejo OAuth2 app (confidential, PKCE, explicit scopes)
        - name: CONSOLE_CLIENT_ID
          valueFrom: {secretKeyRef: {name: console-oauth, key: client_id}}
        - name: CONSOLE_CLIENT_SECRET
          valueFrom: {secretKeyRef: {name: console-oauth, key: client_secret}}
        - name: CONSOLE_SESSION_KEY
          valueFrom: {secretKeyRef: {name: console-oauth, key: session_key}}
        - name: CONSOLE_PUBLIC_URL
          value: https://console.aisoftwarefactory.world
        # metrics, traces and logs to SigNoz's collector, OTLP over HTTP;
        # the agent sandboxes get the same endpoint (ruling 158)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://signoz-otel-collector.platform.svc.cluster.local:4318
        # every second: the console has no backend between the old pod and
        # the new, which takes traffic at its first good probe
        readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 1}
        livenessProbe: {httpGet: {path: /readyz, port: http}}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          # 512Mi: the GitHub exports' git runs in the container, one
          # operation at a time on a repository of at most 200 MiB
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - {name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true}
        # the GitHub exports' throwaway git repositories
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 1Gi}
      # a ServiceAccount token only OpenBao's Kubernetes auth accepts
      # (role factoryd, audience openbao)
      - name: openbao-token
        projected:
          sources:
          - serviceAccountToken: {path: token, audience: openbao, expirationSeconds: 3600}
---
apiVersion: v1
kind: Service
metadata:
  name: factoryd
  namespace: factory
  labels: {app: factoryd}
spec:
  selector: {app: factoryd}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# The console alone, so the edge route can reach nothing else of factoryd.
apiVersion: v1
kind: Service
metadata:
  name: factoryd-console
  namespace: factory
  labels: {app: factoryd}
spec:
  selector: {app: factoryd}
  ports: [{name: console, port: 8090, targetPort: console}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: factory
spec:
  parentRefs:
  - name: edge-gateway
    namespace: forgejo
    sectionName: https-console
  hostnames: [console.aisoftwarefactory.world]
  rules:
  - backendRefs:
    - name: factoryd-console
      port: 8090
---
# Intake callers today reach factoryd by kubectl port-forward, which enters
# the pod's network namespace and is not subject to policy; the node itself
# (kubelet probes) is the only network source for the API port. The console
# port is reached through the edge gateway. Forgejo's webhook deliveries
# (task 42, POST /webhooks/forgejo) and the gateway's escalation hand-over
# (task 52, POST /internal/escalations) arrive over the in-cluster network.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factoryd-ingress
  namespace: factory
spec:
  endpointSelector:
    matchLabels: {app: factoryd}
  ingress:
  - fromEntities: [host]
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  # the edge gateway's Envoy (identity ingress) reaches the console port only
  - fromEntities: [ingress]
    toPorts:
    - ports: [{port: "8090", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: forgejo
        "k8s:io.kubernetes.pod.namespace": forgejo
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  - fromEndpoints:
    - matchLabels: {app: factory-gateway}
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  # SigNoz's webhook channel posts alerts to POST /webhooks/signoz
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: signoz
        "k8s:io.kubernetes.pod.namespace": platform
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  # a project's main workflow, on a CI runner the spawner started for the
  # project, asks GET /projects/{name}/alerts with its FACTORY_READ_TOKEN
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: ci-runner
      matchExpressions:
      - {key: "k8s:io.cilium.k8s.namespace.labels.factory.ai/ci-project", operator: Exists}
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
---
# factoryd holds the LiteLLM master key, the bot password, the S3 keys and
# the Hetzner CI token, and reads the Forgejo admin's login from OpenBao, so
# its egress is default-deny with exactly its callees. Postgres admits
# every sf-cluster instance on 5432 so a failover to another primary keeps
# working; the S3 FQDN must match S3_ENDPOINT above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factoryd-egress
  namespace: factory
spec:
  endpointSelector:
    matchLabels: {app: factoryd}
  egress:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        "k8s:k8s-app": kube-dns
    toPorts:
    - ports: [{port: "53", protocol: ANY}]
      rules:
        dns:
        - matchName: sf-cluster-rw.platform.svc.cluster.local
        - matchName: forgejo-http.forgejo.svc.cluster.local
        - matchName: litellm.platform.svc.cluster.local
        - matchName: temporal-frontend.platform.svc.cluster.local
        - matchName: fsn1.your-objectstorage.com
        - matchName: api.hetzner.cloud
        - matchName: signoz-otel-collector.platform.svc.cluster.local
        - matchName: signoz.platform.svc.cluster.local
        - matchName: forgejo-ssh.forgejo.svc.cluster.local
        - matchName: factory-gateway.factory.svc.cluster.local
        - matchName: openbao.platform.svc.cluster.local
        - matchName: github.com
        - matchName: api.github.com
        - matchName: api.telegram.org
        - matchName: discord.com
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        cnpg.io/cluster: sf-cluster
    toPorts:
    - ports: [{port: "5432", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": forgejo
        app.kubernetes.io/name: forgejo
    toPorts:
    # 2222: Forgejo's SSH (Service port 22), whose host key registration
    # scans for the projects' FORGEJO_SSH_HOST_KEY (ruling 165)
    - ports: [{port: "3000", protocol: TCP}, {port: "2222", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/name: litellm
    toPorts:
    - ports: [{port: "4000", protocol: TCP}]
  # OpenBao: the Forgejo site admin's login at registration
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/name: openbao
        component: server
    toPorts:
    - ports: [{port: "8200", protocol: TCP}]
  # a running agent session's message endpoint (harness.MessagePort), for
  # the loop nudge; the task namespace's worker policy admits only factoryd
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: opencode-worker
      matchExpressions:
      - {key: "k8s:io.cilium.k8s.namespace.labels.factory.ai/task", operator: Exists}
    toPorts:
    - ports: [{port: "8091", protocol: TCP}]
  # the gateway: factoryd's model calls (supervisor, gate supervisor,
  # review) on a task's account
  - toEndpoints:
    - matchLabels: {app: factory-gateway}
    toPorts:
    - ports: [{port: "8081", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/instance: temporal
        app.kubernetes.io/component: frontend
    toPorts:
    - ports: [{port: "7233", protocol: TCP}]
  - toFQDNs:
    - matchName: fsn1.your-objectstorage.com
    - matchName: api.hetzner.cloud
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
  # GitHub: registration's probe of an import's source, and the exports of
  # mode pull_requests, git over HTTPS and the REST API with the export's
  # token
  - toFQDNs:
    - matchName: github.com
    - matchName: api.github.com
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
  # The messengers (roadmap 145): Telegram's bot API and Discord's
  # (its API and OAuth2 pages are discord.com)
  - toFQDNs:
    - matchName: api.telegram.org
    - matchName: discord.com
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: otel-collector
    toPorts:
    - ports: [{port: "4318", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/instance: signoz
        app.kubernetes.io/component: signoz
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
