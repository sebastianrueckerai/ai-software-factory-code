apiVersion: v1
kind: ServiceAccount
metadata:
  name: factoryd
  namespace: factory
---
# Cluster scope holds only what cannot be namespaced: namespace create,
# delete and list, and creating the RoleBinding that grants factoryd-task
# inside each task namespace. RBAC cannot restrict create by name, so the
# ValidatingAdmissionPolicy below confines all of it to factory-agents-*.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd
rules:
- apiGroups: [""]
  resources: [namespaces]
  verbs: [create, delete, list]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  verbs: [create]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  verbs: [bind]
  resourceNames: [factoryd-task]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factoryd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: factoryd
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
# Bound per task namespace by factoryd itself, never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factoryd-task
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [create, delete, get]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [""]
  resources: [serviceaccounts, resourcequotas, limitranges]
  verbs: [create]
- apiGroups: [""]
  # get: the CI reconciler reads the runner registration secret to
  # deregister it from Forgejo before reclaiming the namespace (fix round 1,
  # finding 1) — still confined per-namespace by the RoleBinding above.
  resources: [secrets]
  verbs: [create, get]
- apiGroups: [""]
  # the buildkitd Service a pr-untrusted-build job's namespace holds
  # (ruling 91), giving the runner pod a stable in-namespace DNS name.
  resources: [services]
  verbs: [create]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [create]
---
# The registry pull secret factoryd copies into each task namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factoryd
  namespace: factory
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
  resourceNames: [forgejo-registry]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factoryd
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factoryd
subjects:
- kind: ServiceAccount
  name: factoryd
  namespace: factory
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factoryd-task-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: [CREATE, UPDATE, DELETE]
      resources: ["*"]
      scope: "*"
  matchConditions:
  - name: factoryd
    expression: request.userInfo.username == 'system:serviceaccount:factory:factoryd'
  # access reviews (kubectl auth can-i) are queries, not objects
  - name: not-a-review
    expression: "!(request.resource.group in ['authorization.k8s.io', 'authentication.k8s.io'])"
  variables:
  - name: kind
    expression: request.kind.kind
  - name: target
    expression: "request.kind.kind != 'Namespace' ? request.namespace : request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  validations:
  - expression: variables.target.startsWith('factory-agents-')
    message: factoryd may only act in factory-agents-* namespaces
  - expression: variables.kind in ['Namespace', 'RoleBinding', 'ResourceQuota', 'LimitRange', 'ServiceAccount', 'CiliumNetworkPolicy', 'Secret', 'Pod', 'Service']
    message: factoryd may not create this kind of object
  - expression: >-
      variables.kind != 'Namespace' || request.operation == 'DELETE' ||
      (has(object.metadata.labels) &&
       'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
       ('factory.ai/task' in object.metadata.labels) &&
       (object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted' ||
        (object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'baseline' &&
         object.metadata.name.startsWith('factory-agents-ci-'))))
    message: task namespaces must carry factory.ai/task and pod-security.kubernetes.io/enforce=restricted (baseline only for factory-agents-ci-* build namespaces)
  - expression: >-
      variables.kind != 'RoleBinding' || request.operation == 'DELETE' ||
      (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'factoryd-task' &&
       has(object.subjects) && object.subjects.all(s, s.kind == 'ServiceAccount' &&
       s.name == 'factoryd' && has(s.namespace) && s.namespace == 'factory'))
    message: factoryd may only bind factoryd-task to itself
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gvisor' &&
       has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false)
    message: sandbox pods must run under gVisor without an automounted API token
  # No pod factoryd creates (worker, CI runner, buildkitd) needs privileged
  # containers, added capabilities, hostPath volumes or host namespaces, so
  # these checks apply to every pod, whatever its labels or namespace. The
  # factory.ai/build-pod label buys exactly one thing: the root exemption in
  # the rule below, and only inside factory-agents-ci-*. runtimeClassName and
  # automountServiceAccountToken are not re-checked here: the rule above
  # already requires both for every pod.
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (
        !(object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []) +
          (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
          .exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged == true) &&
        !(object.spec.containers +
          (has(object.spec.initContainers) ? object.spec.initContainers : []) +
          (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
          .exists(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
            has(c.securityContext.capabilities.add) && size(c.securityContext.capabilities.add) > 0) &&
        (!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))) &&
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      )
    message: pods may not have privileged containers, added capabilities, hostPath volumes, hostNetwork, hostPID or hostIPC
  # Effective, not per-field. A container's own runAsNonRoot or runAsUser
  # wins over the pod's; if the container sets neither, the pod's value
  # applies; if neither sets it, it counts as not proven non-root. Checked
  # across containers, initContainers and ephemeralContainers, for every
  # pod factoryd creates anywhere under factory-agents-*, except the
  # labelled build-pod shape in factory-agents-ci-* (ruling 91).
  - expression: >-
      variables.kind != 'Pod' || request.operation == 'DELETE' ||
      (
        variables.target.startsWith('factory-agents-ci-') &&
        has(object.metadata.labels) && 'factory.ai/build-pod' in object.metadata.labels &&
        object.metadata.labels['factory.ai/build-pod'] == 'true'
      ) ||
      (object.spec.containers +
       (has(object.spec.initContainers) ? object.spec.initContainers : []) +
       (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
      .all(c,
        (has(c.securityContext) && has(c.securityContext.runAsNonRoot)
          ? c.securityContext.runAsNonRoot
          : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot))
        &&
        !(has(c.securityContext) && has(c.securityContext.runAsUser)
          ? c.securityContext.runAsUser == 0
          : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) && object.spec.securityContext.runAsUser == 0))
      )
    message: every container, initContainer and ephemeralContainer must have an effective runAsNonRoot of true and an effective runAsUser other than 0 (container overrides pod), unless the pod is the labelled factory.ai/build-pod shape in factory-agents-ci-*
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: factoryd-task-namespaces
spec:
  policyName: factoryd-task-namespaces
  validationActions: [Deny]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factoryd
  namespace: factory
  labels: {app: factoryd}
spec:
  replicas: 1
  # two factoryd pods would race for the same queue
  strategy: {type: Recreate, rollingUpdate: null}
  selector: {matchLabels: {app: factoryd}}
  template:
    metadata:
      labels: {app: factoryd}
    spec:
      serviceAccountName: factoryd
      # room to delete the sandbox, revoke credentials and requeue the task in flight
      terminationGracePeriodSeconds: 150
      automountServiceAccountToken: true
      # every callee is named in full, so the first DNS query is the one the
      # egress policy admits; search-path expansions would be refused
      dnsConfig: {options: [{name: ndots, value: "1"}]}
      imagePullSecrets:
      - name: forgejo-registry
      containers:
      - name: factoryd
        # same image as the gateway; the deployment picks the other binary
        image: git.aisoftwarefactory.world/sf/factory-gateway@sha256:a02a111386deb989fc55b08305f6e09270fa35fb69037a227257bc9829d72915
        command: [factoryd]
        ports: [{name: http, containerPort: 8080}]
        env:
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: username}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: password}}
        - name: FACTORYD_DATABASE_URL
          value: postgres://$(PGUSER):$(PGPASSWORD)@sf-cluster-rw.platform.svc.cluster.local:5432/gateway
        # in-cluster Forgejo: the public host resolves to the edge gateway, which the egress policy does not admit
        - name: FORGEJO_URL
          value: http://forgejo-http.forgejo.svc.cluster.local:3000
        - name: LITELLM_URL
          value: http://litellm.platform.svc.cluster.local:4000
        - name: FORGEJO_BOT_USER
          value: factory-agent
        - name: FORGEJO_BOT_PASSWORD
          valueFrom: {secretKeyRef: {name: forgejo-bot-creds, key: password}}
        - name: FORGEJO_CI_REGISTRAR_TOKEN
          valueFrom: {secretKeyRef: {name: forgejo-ci-registrar, key: token}}
        - name: CI_RUNNER_IMAGE
          value: git.aisoftwarefactory.world/sf/ci-runner@sha256:412dfb6f10df0a82099bcb501951ba8df52e84da3370ad8b31e46fe0448d558a
        - name: LITELLM_MASTER_KEY
          valueFrom: {secretKeyRef: {name: litellm-master-key, key: masterkey}}
        - name: S3_ENDPOINT
          value: https://fsn1.your-objectstorage.com
        - name: S3_BUCKET
          value: aisoftwarefactory-sessions
        - name: S3_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: factory-s3-creds, key: access-key-id}}
        - name: S3_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: factory-s3-creds, key: secret-access-key}}
        - name: WORKER_IMAGE
          value: git.aisoftwarefactory.world/sf/opencode-worker@sha256:9c5b5a445ab3cf9fdde6cd6e4dd9ee9da08736dab323454a17acfa4271a44263
        - name: GATEWAY_URL
          value: http://factory-gateway.factory.svc.cluster.local:8081
        - name: INTAKE_TOKEN
          valueFrom: {secretKeyRef: {name: factoryd-intake, key: token}}
        - name: FORGEJO_WEBHOOK_SECRET
          valueFrom: {secretKeyRef: {name: factoryd-webhook, key: secret}}
        - name: MAX_BUDGET_EUR
          value: "5"
        readinessProbe: {httpGet: {path: /readyz, port: http}}
        livenessProbe: {httpGet: {path: /readyz, port: http}}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: factoryd
  namespace: factory
  labels: {app: factoryd}
spec:
  selector: {app: factoryd}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Intake callers today reach factoryd by kubectl port-forward, which enters
# the pod's network namespace and is not subject to policy; the node itself
# (kubelet probes) is the only network source. Forgejo's webhook deliveries
# (task 42, POST /webhooks/forgejo) are the one caller that arrives over the
# in-cluster network instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factoryd-ingress
  namespace: factory
spec:
  endpointSelector:
    matchLabels: {app: factoryd}
  ingress:
  - fromEntities: [host]
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: forgejo
        "k8s:io.kubernetes.pod.namespace": forgejo
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
---
# factoryd holds the LiteLLM master key, the bot password and the S3 keys,
# so its egress is default-deny with exactly its callees. Postgres admits
# every sf-cluster instance on 5432 so a failover to another primary keeps
# working; the S3 FQDN must match S3_ENDPOINT above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factoryd-egress
  namespace: factory
spec:
  endpointSelector:
    matchLabels: {app: factoryd}
  egress:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        "k8s:k8s-app": kube-dns
    toPorts:
    - ports: [{port: "53", protocol: ANY}]
      rules:
        dns:
        - matchName: sf-cluster-rw.platform.svc.cluster.local
        - matchName: forgejo-http.forgejo.svc.cluster.local
        - matchName: litellm.platform.svc.cluster.local
        - matchName: temporal-frontend.platform.svc.cluster.local
        - matchName: fsn1.your-objectstorage.com
  - toEntities: [kube-apiserver]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        cnpg.io/cluster: sf-cluster
    toPorts:
    - ports: [{port: "5432", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": forgejo
        app.kubernetes.io/name: forgejo
    toPorts:
    - ports: [{port: "3000", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/name: litellm
    toPorts:
    - ports: [{port: "4000", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/instance: temporal
        app.kubernetes.io/component: frontend
    toPorts:
    - ports: [{port: "7233", protocol: TCP}]
  - toFQDNs:
    - matchName: fsn1.your-objectstorage.com
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
