apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No kustomization-level namespace: it would override the explicit one on the
# platform-scoped Database CR (CNPG clusters are namespace-local).
resources:
- database.yaml
- serviceaccount.yaml
- deployment.yaml
- factoryd.yaml
- service.yaml
# The factory's own SigNoz alert rules (rulings 159, 180), one rule per key:
# the platform's signoz-objects job applies them bound to namespace factory
# and routes them to factoryd's intake, where a firing one files a bug issue
# on this repository.
configMapGenerator:
# The public half of main CI's cosign key, for the roller (roadmap 46);
# the name's hash rolls factoryd onto a new key.
- name: image-signing
  namespace: factory
  files: [cosign.pub]
- name: signoz-rules
  namespace: factory
  files: [alerts/5xx-rate.json, alerts/restarts-factoryd.json, alerts/restarts-gateway.json, platform/signoz/project-rules/ci-queue-p95.json, alerts/roll-not-live-factoryd.json, alerts/roll-not-live-gateway.json]
  options:
    disableNameSuffixHash: true
    labels: {factory/signoz-rules: "true"}
