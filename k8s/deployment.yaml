apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-gateway
  namespace: factory
  labels: {app: factory-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: factory-gateway}}
  template:
    metadata:
      labels: {app: factory-gateway}
    spec:
      serviceAccountName: factory-gateway
      automountServiceAccountToken: true # the JWKS fetch authenticates with this token
      # every callee is named in full, so the first DNS query is the one the
      # egress policy admits; search-path expansions would be refused
      dnsConfig: {options: [{name: ndots, value: "1"}]}
      imagePullSecrets:
      - name: forgejo-registry
      containers:
      - name: gateway
        image: git.aisoftwarefactory.world/sf/factory-gateway@sha256:36dd329a2ef44d930ad075c26113ee2034c9da1c9e773a160f268f6b0fe015b0
        ports: [{name: http, containerPort: 8081}]
        env:
        - name: LITELLM_URL
          value: http://litellm.platform.svc.cluster.local:4000
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: username}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: factory-db-creds, key: password}}
        - name: DATABASE_URL
          value: postgres://$(PGUSER):$(PGPASSWORD)@sf-cluster-rw.platform.svc.cluster.local:5432/gateway
        - name: LITELLM_MASTER_KEY
          valueFrom: {secretKeyRef: {name: litellm-master-key, key: masterkey}}
        - name: GATEWAY_AUDIENCE
          value: factory-gateway
        # the MCP tools' provider keys: only the gateway holds them
        - name: FIRECRAWL_KEY
          valueFrom: {secretKeyRef: {name: gateway-tool-keys, key: FIRECRAWL_KEY}}
        - name: REPLICATE_KEY
          valueFrom: {secretKeyRef: {name: gateway-tool-keys, key: REPLICATE_KEY}}
        - name: FAL_AI_KEY
          valueFrom: {secretKeyRef: {name: gateway-tool-keys, key: FAL_AI_KEY}}
        # escalate_to_human's hand-over to factoryd's internal endpoint
        - name: FACTORYD_URL
          value: http://factoryd.factory.svc.cluster.local:8080
        - name: FACTORYD_TOKEN
          valueFrom: {secretKeyRef: {name: gateway-factoryd, key: token}}
        # commissioning: the agent Hetzner project's token (only the gateway
        # holds it), the nodes' IPv4s the servers' SSH firewall admits, and
        # OpenBao's SSH CA (Kubernetes auth with this pod's token)
        - name: HETZNER_AGENT_KEY
          valueFrom: {secretKeyRef: {name: hetzner-agent, key: token}}
        - name: AGENT_SSH_SOURCES
          valueFrom: {configMapKeyRef: {name: cluster-facts, key: node_public_ips}}
        # plain HTTP in the cluster: Cilium's WireGuard encrypts pod traffic
        # between nodes
        - name: OPENBAO_URL
          value: http://openbao.platform.svc.cluster.local:8200
        readinessProbe: {httpGet: {path: /healthz, port: http}}
        livenessProbe: {httpGet: {path: /healthz, port: http}}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        volumeMounts:
        - {name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true}
      volumes:
      # a ServiceAccount token only OpenBao's Kubernetes auth accepts
      # (role factory-gateway, audience openbao)
      - name: openbao-token
        projected:
          sources:
          - serviceAccountToken: {path: token, audience: openbao, expirationSeconds: 3600}
---
# The gateway holds the LiteLLM master key, the tool providers' keys and
# the agent Hetzner project's token, so its egress is default-deny with
# exactly its callees: LiteLLM, Postgres (every sf-cluster instance, so a
# failover keeps working), factoryd's internal endpoint, OpenBao (the SSH
# CA), the API server (JWKS, by the Service address from the pod
# environment), and the providers by name on 443.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-gateway-egress
  namespace: factory
spec:
  endpointSelector:
    matchLabels: {app: factory-gateway}
  egress:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": kube-system
        "k8s:k8s-app": kube-dns
    toPorts:
    - ports: [{port: "53", protocol: ANY}]
      rules:
        dns:
        - matchName: sf-cluster-rw.platform.svc.cluster.local
        - matchName: litellm.platform.svc.cluster.local
        - matchName: factoryd.factory.svc.cluster.local
        - matchName: api.firecrawl.dev
        - matchName: api.replicate.com
        - matchName: fal.run
        - matchName: api.fal.ai
        - matchName: api.hetzner.cloud
        - matchName: openbao.platform.svc.cluster.local
  # the Service's 443 reaches the API servers on 6443 (policy sees the
  # translated backend)
  - toEntities: [kube-apiserver]
    toPorts:
    - ports: [{port: "6443", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        cnpg.io/cluster: sf-cluster
    toPorts:
    - ports: [{port: "5432", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/name: litellm
    toPorts:
    - ports: [{port: "4000", protocol: TCP}]
  - toEndpoints:
    - matchLabels: {app: factoryd}
    toPorts:
    - ports: [{port: "8080", protocol: TCP}]
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": platform
        app.kubernetes.io/name: openbao
        component: server
    toPorts:
    - ports: [{port: "8200", protocol: TCP}]
  - toFQDNs:
    - matchName: api.firecrawl.dev
    - matchName: api.replicate.com
    - matchName: fal.run
    - matchName: api.fal.ai
    - matchName: api.hetzner.cloud
    toPorts:
    - ports: [{port: "443", protocol: TCP}]
