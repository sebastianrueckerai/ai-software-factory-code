images:
  chromium:
    apt: [chromium, fonts-liberation]
    upstream:
      - name: go
        url: https://go.dev/dl/go1.26.11.linux-amd64.tar.gz
        sha256: 9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec
        to: /usr/local/go
        strip: 1
      - name: node
        url: https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz
        sha256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
        to: /usr/local
        strip: 1
    env:
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOTOOLCHAIN: local
    path:
      - /usr/local/go/bin
      - /home/worker/go/bin
    egress:
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      - registry.npmjs.org
