images:
  chromium:
    apt: [chromium, fonts-liberation]
    upstream:
      - name: go
        url: https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
        sha256: ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
        to: /usr/local/go
        strip: 1
      - name: node
        url: https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz
        sha256: 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75
        to: /usr/local
        strip: 1
    env:
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOTOOLCHAIN: local
    path:
      - /usr/local/go/bin
      - /home/worker/go/bin
    egress:
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      - registry.npmjs.org
