# Ruling 78/89 (task 41): pull requests from agent branches run on the
# untrusted host executor — a fresh gVisor pod, no repository or registry
# credential beyond the per-run job token Forgejo injects, default-deny
# egress. Every tool a step needs (Go, gosec) ships pre-installed in
# Dockerfile.runner so no step reaches past the egress allowlist for
# tooling; only actions/checkout itself, the Go module proxy, and the
# Dockerfiles' base-image registries are reachable (see ciEgressSpec in
# internal/factoryd/ci.go).
#
# No secrets.* anywhere in this file — the runner pod holds none.
#
# image-build (ruling 91) verifies Dockerfile / Dockerfile.sandbox /
# Dockerfile.runner build cleanly, without ever pushing. No rootless BuildKit
# path comes up under gVisor (task-41-report.md, design decision #4), so
# `runs-on: pr-untrusted-build` gets factoryd's CI spawner to stand up a
# second, sandbox-root buildkitd pod (internal/factoryd/ci.go) alongside the
# usual restricted runner pod; the runner drives it over BUILDKIT_HOST with
# no token, Secret or ServiceAccount token of its own.
name: pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: go test -race -p 1 ./...
  vet-and-format:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
  security:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: gosec ./...
  job-env-audit:
    runs-on: pr-untrusted
    steps:
      - name: print job environment variable NAMES only
        run: env | cut -d= -f1 | sort
  image-build:
    # ruling 91: builds only, never pushes — output goes to /dev/null on the
    # runner pod (BuildKit 0.33 has no cacheonly exporter). The buildkitd
    # pod holds no token, Secret or ServiceAccount token; the runner reaches
    # it over BUILDKIT_HOST, which factoryd's CI spawner injects.
    runs-on: pr-untrusted-build
    steps:
      - uses: actions/checkout@v4
      - name: build Dockerfile
        run: buildctl build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=Dockerfile --output type=oci,dest=/dev/null
      - name: build Dockerfile.sandbox
        run: buildctl build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=Dockerfile.sandbox --output type=oci,dest=/dev/null
      - name: build Dockerfile.runner
        run: buildctl build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=Dockerfile.runner --output type=oci,dest=/dev/null
