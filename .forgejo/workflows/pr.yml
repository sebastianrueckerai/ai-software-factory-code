# Ruling 78/89 (task 41): pull requests from agent branches run on the
# untrusted host executor — a fresh gVisor pod, no repository or registry
# credential beyond the per-run job token Forgejo injects, default-deny
# egress. Every tool a step needs (Go, gosec) ships pre-installed in
# Dockerfile.runner so no step reaches past the egress allowlist for
# tooling; only actions/checkout itself and the Go module proxy are
# reachable, and for image-build the job's own build VM, the read-only
# build cache and Docker Hub's token service (buildctl answers the build
# VM's token requests); see ciEgressSpec in internal/factoryd/ci.go.
#
# No secrets.* anywhere in this file — the runner pod holds no repository
# or registry credential.
#
# image-build verifies the changed Dockerfiles build, without ever pushing.
# `runs-on: pr-untrusted-build` (only when there is something to build) gets factoryd's CI spawner to create a
# throwaway Hetzner VM running buildkitd (ruling 110,
# internal/factoryd/buildvm.go) and to hand the runner pod its address
# (BUILDKIT_HOST) and a client certificate only that VM accepts
# (BUILDKIT_TLS_DIR, BUILDKIT_TLS_SERVERNAME). The VM is deleted when the
# job ends.
name: pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: go test -race -p 1 ./...
  vet-and-format:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
  security:
    runs-on: pr-untrusted
    steps:
      - uses: actions/checkout@v4
      - run: gosec ./...
  job-env-audit:
    runs-on: pr-untrusted
    steps:
      - name: print job environment variable NAMES only
        run: env | cut -d= -f1 | sort
      # The per-run job token (FORGEJO_TOKEN = GITHUB_TOKEN, plus the runtime
      # token) is the only credential a PR job may hold. forgejo-runner sets
      # ACTIONS_ID_TOKEN_REQUEST_TOKEN and _URL on every job, empty unless the
      # workflow enables enable-openid-connect, which Forgejo overrides to off
      # on a fork's pull request (backlog 56).
      - name: assert no registry or repository write credential
        run: |
          bad=$(env | cut -d= -f1 | grep -Ei '(TOKEN|PASSWORD|PASSWD|SECRET|CREDENTIALS?|AUTH|(^|_)PAT|(^|_)KEY)$|REGISTRY|DOCKER' \
            | grep -Evx 'FORGEJO_TOKEN|GITHUB_TOKEN|GITEA_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN' || true)
          if [ -n "$bad" ]; then echo "credential-shaped variables: $bad"; exit 1; fi
          if [ -e "$HOME/.docker/config.json" ] || [ -e "$HOME/.git-credentials" ]; then echo "credential file in HOME"; exit 1; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "the job can request an OIDC ID token"; exit 1; fi
          echo "only the per-run job token is present"
      - name: assert the job token reads but cannot push
        run: |
          set -eu
          auth="Authorization: Basic $(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          url="$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          probe="refs/heads/job-token-probe-$FORGEJO_RUN_ID"
          g() { GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="$auth" git "$@"; }
          git init -q /tmp/probe && cd /tmp/probe
          git -c user.name=probe -c user.email=probe@invalid commit -q --allow-empty -m probe
          if g push -q "$url" "HEAD:$probe" >/tmp/push.log 2>&1; then
            g push -q "$url" ":$probe" || true
            echo "the job token pushed $probe (deleted again): it has repository write access"; exit 1
          fi
          echo "push refused:"; head -n 3 /tmp/push.log | sed "s/$FORGEJO_TOKEN/***/g"
          g ls-remote --exit-code "$url" refs/heads/main >/dev/null
          if g ls-remote --exit-code "$url" "$probe" >/dev/null; then echo "$probe exists"; exit 1; fi
          echo "the job token reads the repository and cannot write it"
  changes:
    # Build only what a PR changes. This map is the only place that decides
    # which images image-build builds, and it lives only here: .forgejo is
    # closed to agent edits (ruling 90/100), so a PR cannot widen or narrow
    # its own build coverage by editing a script elsewhere in the repo. Each
    # entry's inputs mirror that Dockerfile's own COPY lines from the build
    # context (a base image and ADD-fetched tools come from outside the
    # context and never change with the PR, so they need no entry):
    #   Dockerfile          COPY go.mod go.sum ./ ; COPY cmd/ cmd/ ; COPY internal/ internal/
    #   Dockerfile.sandbox  COPY go.mod go.sum ./ ; COPY cmd/ cmd/ ; COPY internal/ internal/ ;
    #                       COPY opencode-plugin/package.json opencode-plugin/package-lock.json ./
    #   Dockerfile.runner   copies nothing from the build context
    runs-on: pr-untrusted
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - name: select images to build
        id: select
        run: |
          set -euo pipefail
          base=${{ github.event.pull_request.base.sha }}
          # checkout is shallow (HEAD only); fetch just the one base commit to diff against.
          git fetch -q --depth=1 origin "$base"
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"
          echo "$changed"

          images=""
          for df in Dockerfile Dockerfile.sandbox Dockerfile.runner; do
            case "$df" in
              Dockerfile) inputs="go.mod go.sum cmd/ internal/" ;;
              Dockerfile.sandbox) inputs="go.mod go.sum cmd/ internal/ opencode-plugin/" ;;
              Dockerfile.runner) inputs="" ;;
              *) echo "no input map for $df" >&2; exit 1 ;;
            esac
            build=0
            echo "$changed" | grep -qxF "$df" && build=1
            echo "$changed" | grep -qxF ".dockerignore" && build=1
            for p in $inputs; do
              case "$p" in
                */) echo "$changed" | grep -q "^$p" && build=1 ;;
                *) echo "$changed" | grep -qxF "$p" && build=1 ;;
              esac
            done
            [ "$build" = 1 ] && images="$images $df"
          done
          images=$(echo "$images" | xargs)
          echo "images to build: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"
  image-build:
    # Builds only, never pushes: output goes to /dev/null on the runner pod
    # (BuildKit 0.33 has no cacheonly exporter). Forgejo hands a job to a
    # runner before its `if` is evaluated, so the label carries the same
    # test: with nothing to build, an ordinary runner skips the job and no
    # build VM is made.
    needs: changes
    if: needs.changes.outputs.images != ''
    runs-on: ${{ needs.changes.outputs.images != '' && 'pr-untrusted-build' || 'pr-untrusted' }}
    steps:
      - uses: actions/checkout@v4
      - name: wait for the build VM's buildkitd
        # the pod's init container buildkitd-ready already waited up to
        # 3 minutes; this fails the job loudly when buildkitd never answered
        run: |
          set -u
          echo "buildkitd at $BUILDKIT_HOST, mTLS, server name $BUILDKIT_TLS_SERVERNAME"
          deadline=$(( $(date +%s) + 60 ))
          until buildctl --tlsdir "$BUILDKIT_TLS_DIR" --tlsservername "$BUILDKIT_TLS_SERVERNAME" debug workers; do
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "buildkitd did not answer within 4 minutes of the runner's start"; exit 1; fi
            sleep 3
          done
      - name: build changed images in parallel
        # Each build first copies its image's layer cache, written by main CI
        # to the in-cluster build cache (read-only from here, ruling 111),
        # into a local OCI layout that buildctl streams to the VM. A missing
        # cache only means a cold build.
        run: |
          set -uo pipefail
          images="${{ needs.changes.outputs.images }}"
          echo "building:$images"
          logdir=$(mktemp -d)
          # the pod's 8Gi emptyDir, outside the checkout (the build context)
          cachedir=$(mktemp -d -p /workspace)
          cache=build-cache.forgejo.svc.cluster.local:5000/cache
          declare -A image_for=([Dockerfile]=factory-gateway [Dockerfile.sandbox]=opencode-worker [Dockerfile.runner]=ci-runner)
          build() {
            local df=$1 image=${image_for[$1]:-} digest reason import=() start=$SECONDS
            # bounded: a stalled cache must fall through to a cold build
            if [ -n "$image" ] \
              && digest=$(timeout 120 crane digest --insecure "$cache/$image:main" 2>"$logdir/$df.crane") \
              && timeout 120 crane pull --insecure --format=oci "$cache/$image@$digest" "$cachedir/$image" 2>"$logdir/$df.crane"; then
              echo "cache: $cache/$image@$digest, fetched in $((SECONDS - start)) s"
              # crane's layout carries no tag, so name the manifest by digest
              import=(--import-cache "type=local,src=$cachedir/$image,digest=$digest")
            else
              reason=$(tail -n 1 "$logdir/$df.crane" 2>/dev/null)
              echo "no cache for ${image:-$df}, building without it: ${reason:-no cache name for $df, or the fetch timed out}"
            fi
            buildctl --tlsdir "$BUILDKIT_TLS_DIR" --tlsservername "$BUILDKIT_TLS_SERVERNAME" \
              build --progress=plain --frontend dockerfile.v0 --local context=. --local dockerfile=. \
              --opt filename="$df" --output type=oci,dest=/dev/null "${import[@]}"
          }
          declare -A pid_for
          for df in $images; do
            build "$df" >"$logdir/$df.log" 2>&1 &
            pid_for[$df]=$!
          done
          status=0
          for df in $images; do
            if wait "${pid_for[$df]}"; then result="ok: $df"; else status=1; result="FAILED: $df"; fi
            echo "---- $df build log ----"
            cat "$logdir/$df.log"
            echo "$result"
          done
          exit $status
