name: ci
on:
  push:
    branches: [main]
env:
  # Each image's layer cache for the pull-request builds (infra
  # k8s/platform/build-cache, ruling 111): main writes it, PR jobs only read
  # it; plain HTTP inside the cluster. A cache outage never fails main: the
  # import only warns, the export ignores errors.
  CACHE: build-cache.forgejo.svc.cluster.local:5000/cache
  # main's image builder (roadmap 242), the buildkitd release the pull
  # request build VM runs. The dind's builtin builder takes the exporter's
  # rewrite-timestamp and still writes the wall clock into the layers; a
  # buildkitd rewrites every layer time to the image's epoch. Each image job
  # makes its own on the pod's network, as the job runs, to reach the build
  # cache.
  # Each image's inputs in the build context: its epoch is the newest
  # commit touching them (roadmap 250), so a commit that touches none
  # keeps the image's digest. They mirror each Dockerfile's COPY lines and
  # the runner's warm-step mounts.
  GATEWAY_INPUTS: Dockerfile .dockerignore go.mod go.sum cmd internal
  SANDBOX_INPUTS: Dockerfile.sandbox .dockerignore go.mod go.sum cmd internal opencode-plugin/package.json opencode-plugin/package-lock.json
  # the sandbox's base stage copies nothing from the context
  SANDBOX_BASE_INPUTS: Dockerfile.sandbox
  RUNNER_INPUTS: Dockerfile.runner .dockerignore go.mod go.sum cmd internal acceptance
  BUILDKIT: git.aisoftwarefactory.world/upstream/docker.io/moby/buildkit:v0.33.0@sha256:a461e7f0ce921972028acfbed628d45663d83e67ac1230722c2b34cf72760a0d
# One main run at a time: a newer push waits out the running one instead of
# cancelling it (Forgejo's default), so no half-tested run is wasted; the
# roller still judges the newest green build.
concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  upstream:
    # Every outside image of upstream-images.txt, and every other build
    # input (upstream-files.txt, the Go module cache of go.sum, the npm
    # cache of the opencode plugin), into the store before anything builds
    # from it (roadmap 203). A copy the store holds is left alone, so only a
    # new line reaches its upstream. crane, go and npm run in the CI runner
    # image factoryd pins; the job's docker is the runner's dind, which
    # cannot see the job's files, so the lists and the scripts travel as a
    # tar stream.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: copy the outside images and build inputs into the store
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          runner=$(sed -n '/name: CI_RUNNER_IMAGE/{n;s/.*value: //p}' k8s/factoryd.yaml)
          tar -c upstream-images.txt upstream-files.txt go.mod go.sum opencode-plugin scripts/upstream-copy scripts/upstream-files | docker run -i --rm -e REGISTRY_USER -e REGISTRY_PASSWORD --entrypoint bash "$runner" \
            -c 'set -euo pipefail; cd "$(mktemp -d)"; tar -x; printf %s "$REGISTRY_PASSWORD" | crane auth login git.aisoftwarefactory.world -u "$REGISTRY_USER" --password-stdin; scripts/upstream-copy; scripts/upstream-files'
  test:
    # The warm Go caches of a main job live in docker named volumes on this
    # runner's own dind, which only ubuntu-latest jobs reach — untrusted PR
    # jobs run on the factory's gVisor pods and never touch this runner, so
    # nothing an untrusted run wrote reaches a main job (ruling 226's line,
    # kept without main running cold). The test environment is the CI runner
    # image itself — the same image the PR jobs test in, Go and PG 17
    # preinstalled — built from this commit's Dockerfile.runner on the layer
    # cache main's image job writes (ruling 111: main writes that cache).
    needs: upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build the CI runner image on the layer cache
        # roadmap 232: the runner image's epoch, the one its image job
        # builds with, so the layers after its ARG come from the cache
        run: |
          EPOCH=$(git log -1 --pretty=%ct -- $RUNNER_INPUTS)
          docker build -f Dockerfile.runner -t ci-runner:test --build-arg SOURCE_DATE_EPOCH=$EPOCH --cache-from type=registry,ref=$CACHE/ci-runner:main,registry.insecure=true .
      - name: test and vet with the warm caches
        # the checkout travels as a tar stream: the job container's filesystem
        # holds it, and the dind daemon can bind-mount only its own paths
        run: |
          set -euo pipefail
          tar -c . | docker run -i --rm --user 0:0 \
            -v ci-go-build:/cache/go-build -v ci-go-mod:/modcache \
            -e GOCACHE=/cache/go-build -e GOMODCACHE=/modcache -e GOPATH=/tmp/go \
            --entrypoint /bin/bash ci-runner:test \
            -c 'mkdir -p /tmp/src && tar -x -C /tmp/src && cd /tmp/src && scripts/pg-test.sh go test -race ./... && go vet ./... && test -z "$(gofmt -l .)" && gosec -quiet ./... && govulncheck -db file:///usr/local/share/govulndb ./...'
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push gateway image
        # also as :main, the newest green main's factoryd, which the infra
        # repository's config-check runs against the configuration
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $GATEWAY_INPUTS)
          B=image-gateway
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" --build-arg SOURCE_DATE_EPOCH=$EPOCH --metadata-file /tmp/image.json \
            --cache-from type=registry,ref=$CACHE/factory-gateway:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/factory-gateway:main,mode=max,registry.insecure=true,ignore-error=true \
            --output "type=image,\"name=git.aisoftwarefactory.world/sf/factory-gateway:$SHA,git.aisoftwarefactory.world/sf/factory-gateway:main\",push=true,rewrite-timestamp=true" .
      - name: sign the gateway image
        # by the digest pushed, with the factory's key (roadmap 46): the
        # roller rolls no image without this signature. cosign is
        # Dockerfile.runner's pinned download; a signing config of no services
        # keeps the signature in the registry beside the image, out of any
        # transparency log. Only this job and the two below read the key.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker build -f Dockerfile.runner --target cosign -o /tmp/cosign .
          printf '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json"}' > /tmp/signing-config.json
          /tmp/cosign/cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config /tmp/signing-config.json \
            git.aisoftwarefactory.world/sf/factory-gateway@$(jq -r '."containerimage.digest"' /tmp/image.json)
  image-sandbox:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push the sandbox images
        # the base too, sandbox-base: the sandbox without the harness and
        # the stack, which project images build on
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $SANDBOX_INPUTS)
          BASE_EPOCH=$(git log -1 --pretty=%ct -- $SANDBOX_BASE_INPUTS)
          B=image-sandbox
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" -f Dockerfile.sandbox --target base --build-arg SOURCE_DATE_EPOCH=$BASE_EPOCH --metadata-file /tmp/base.json \
            --cache-from type=registry,ref=$CACHE/sandbox-base:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/sandbox-base:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/sandbox-base:$SHA,push=true,rewrite-timestamp=true .
          docker buildx build --builder "$B" -f Dockerfile.sandbox --build-arg SOURCE_DATE_EPOCH=$EPOCH --metadata-file /tmp/image.json \
            --cache-from type=registry,ref=$CACHE/opencode-worker:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/opencode-worker:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/opencode-worker:$SHA,push=true,rewrite-timestamp=true .
          # the smoke run pulls what was pushed, the artifact everyone deploys:
          # the builder keeps no image in the daemon
          docker run --rm --entrypoint sh git.aisoftwarefactory.world/sf/opencode-worker:$SHA \
            -c "gcc --version && make --version && python3 --version"
      - name: sign the sandbox images
        # as the gateway's
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker build -f Dockerfile.runner --target cosign -o /tmp/cosign .
          printf '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json"}' > /tmp/signing-config.json
          /tmp/cosign/cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config /tmp/signing-config.json \
            git.aisoftwarefactory.world/sf/sandbox-base@$(jq -r '."containerimage.digest"' /tmp/base.json)
          /tmp/cosign/cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config /tmp/signing-config.json \
            git.aisoftwarefactory.world/sf/opencode-worker@$(jq -r '."containerimage.digest"' /tmp/image.json)
  image-runner:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push CI runner image
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $RUNNER_INPUTS)
          B=image-runner
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" -f Dockerfile.runner --build-arg SOURCE_DATE_EPOCH=$EPOCH --metadata-file /tmp/image.json \
            --cache-from type=registry,ref=$CACHE/ci-runner:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/ci-runner:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/ci-runner:$SHA,push=true,rewrite-timestamp=true .
      - name: sign the CI runner image
        # as the gateway's
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker build -f Dockerfile.runner --target cosign -o /tmp/cosign .
          printf '{"mediaType":"application/vnd.dev.sigstore.signingconfig.v0.2+json"}' > /tmp/signing-config.json
          /tmp/cosign/cosign sign --yes --key env://COSIGN_PRIVATE_KEY --signing-config /tmp/signing-config.json \
            git.aisoftwarefactory.world/sf/ci-runner@$(jq -r '."containerimage.digest"' /tmp/image.json)
