name: ci
on:
  push:
    branches: [main]
env:
  # Each image's layer cache for the pull-request builds (infra
  # k8s/platform/build-cache, ruling 111): main writes it, PR jobs only read
  # it; plain HTTP inside the cluster. A cache outage never fails main: the
  # import only warns, the export ignores errors.
  CACHE: build-cache.forgejo.svc.cluster.local:5000/cache
  # main's image builder (roadmap 242), the buildkitd release the pull
  # request build VM runs. The dind's builtin builder takes the exporter's
  # rewrite-timestamp and still writes the wall clock into the layers; a
  # buildkitd rewrites every layer time to the image's epoch. Each image job
  # makes its own on the pod's network, as the job runs, to reach the build
  # cache.
  # Each image's inputs in the build context: its epoch is the newest
  # commit touching them (roadmap 250), so a commit that touches none
  # keeps the image's digest. They mirror each Dockerfile's COPY lines;
  # the runner's warm step bind-mounts the context and compiles every Go
  # package in it.
  GATEWAY_INPUTS: Dockerfile .dockerignore go.mod go.sum cmd internal
  SANDBOX_INPUTS: Dockerfile.sandbox .dockerignore go.mod go.sum cmd internal opencode-plugin/package.json opencode-plugin/package-lock.json
  RUNNER_INPUTS: Dockerfile.runner .dockerignore go.mod go.sum cmd internal acceptance
  BUILDKIT: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
jobs:
  test:
    # The warm Go caches of a main job live in docker named volumes on this
    # runner's own dind, which only ubuntu-latest jobs reach — untrusted PR
    # jobs run on the factory's gVisor pods and never touch this runner, so
    # nothing an untrusted run wrote reaches a main job (ruling 226's line,
    # kept without main running cold). The test environment is the CI runner
    # image itself — the same image the PR jobs test in, Go and PG 17
    # preinstalled — built from this commit's Dockerfile.runner on the layer
    # cache main's image job writes (ruling 111: main writes that cache).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build the CI runner image on the layer cache
        # roadmap 232: the runner image's epoch, the one its image job
        # builds with, so the layers after its ARG come from the cache
        run: |
          EPOCH=$(git log -1 --pretty=%ct -- $RUNNER_INPUTS)
          docker build -f Dockerfile.runner -t ci-runner:test --build-arg SOURCE_DATE_EPOCH=$EPOCH --cache-from type=registry,ref=$CACHE/ci-runner:main,registry.insecure=true .
      - name: test and vet with the warm caches
        # the checkout travels as a tar stream: the job container's filesystem
        # holds it, and the dind daemon can bind-mount only its own paths
        run: |
          set -euo pipefail
          tar -c . | docker run -i --rm --user 0:0 \
            -v ci-go-build:/cache/go-build -v ci-go-mod:/modcache \
            -e GOCACHE=/cache/go-build -e GOMODCACHE=/modcache -e GOPATH=/tmp/go \
            --entrypoint /bin/bash ci-runner:test \
            -c 'mkdir -p /tmp/src && tar -x -C /tmp/src && cd /tmp/src && scripts/pg-test.sh go test -race ./... && go vet ./... && test -z "$(gofmt -l .)" && gosec -quiet ./...'
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push gateway image
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $GATEWAY_INPUTS)
          B=image-gateway
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" --build-arg SOURCE_DATE_EPOCH=$EPOCH \
            --cache-from type=registry,ref=$CACHE/factory-gateway:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/factory-gateway:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/factory-gateway:$SHA,push=true,rewrite-timestamp=true .
  image-sandbox:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push sandbox image
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $SANDBOX_INPUTS)
          B=image-sandbox
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" -f Dockerfile.sandbox --build-arg SOURCE_DATE_EPOCH=$EPOCH \
            --cache-from type=registry,ref=$CACHE/opencode-worker:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/opencode-worker:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/opencode-worker:$SHA,push=true,rewrite-timestamp=true .
          # the smoke run pulls what was pushed, the artifact everyone deploys:
          # the builder keeps no image in the daemon
          docker run --rm --entrypoint sh git.aisoftwarefactory.world/sf/opencode-worker:$SHA \
            -c "gcc --version && make --version && python3 --version"
  image-runner:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: registry login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.aisoftwarefactory.world -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: build and push CI runner image
        run: |
          SHA=${GITHUB_SHA::7}
          EPOCH=$(git log -1 --pretty=%ct -- $RUNNER_INPUTS)
          B=image-runner
          printf '[registry."%s"]\n  http = true\n' "${CACHE%%/*}" > /tmp/buildkitd.toml
          # buildx takes no TLS endpoint from the environment, only a context
          docker context rm -f "$B-tls" >/dev/null 2>&1 || true
          docker context create "$B-tls" --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem" >/dev/null 2>&1
          # a cancelled run leaves its buildkitd behind: clear it first
          docker buildx create --name "$B" "$B-tls" >/dev/null && docker buildx rm "$B"
          docker buildx create --name "$B" --driver docker-container --driver-opt network=host --driver-opt image=$BUILDKIT --buildkitd-config /tmp/buildkitd.toml "$B-tls"
          trap 'docker buildx rm "$B"' EXIT
          docker buildx build --builder "$B" -f Dockerfile.runner --build-arg SOURCE_DATE_EPOCH=$EPOCH \
            --cache-from type=registry,ref=$CACHE/ci-runner:main,registry.insecure=true \
            --cache-to type=registry,ref=$CACHE/ci-runner:main,mode=max,registry.insecure=true,ignore-error=true \
            --output type=image,name=git.aisoftwarefactory.world/sf/ci-runner:$SHA,push=true,rewrite-timestamp=true .
