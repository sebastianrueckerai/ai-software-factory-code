{{define "head"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false}'>
<title>Factory console</title>
<link rel="stylesheet" href="/static/console.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/console.js" defer></script>
</head>
<body{{if .CSRF}} hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}'{{end}}>
<header>
<a class="home" href="/">Factory console</a>
{{if .CSRF}}<nav aria-label="Main"><a href="/">Board</a> <a href="/tasks/new">New task</a> <a href="/projects">Projects</a> <a href="/resources">Resources</a> <a href="/costs">Costs</a> <a href="/policy">Policy</a> <a href="/alerts">Alerts</a></nav>{{end}}
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to the light theme" title="Dark theme is the default; your choice is remembered">Theme: dark</button>
{{if .CSRF}}<form method="post" action="/logout" class="logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><span>{{.User}}</span> <button type="submit">Log out</button></form>{{end}}
</header>
<main>
<p id="flash" class="problem" role="alert" hidden></p>
{{end}}

{{define "foot"}}</main>
<footer id="live" role="status"></footer>
</body>
</html>
{{end}}

{{define "supervised"}}{{if .Action}}<strong>{{.Action}}</strong>: {{.Diagnosis}}{{end}}{{end}}

{{define "verdict"}}<form method="post" action="/alerts/{{.ID}}/verdict" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="back" value="{{.Back}}"><input type="hidden" name="verdict" value="real"><button type="submit" aria-label="Alert {{.ID}}: a real problem">real problem</button></form>
<form method="post" action="/alerts/{{.ID}}/verdict" class="inline"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="back" value="{{.Back}}"><input type="hidden" name="verdict" value="noise"><button type="submit" class="deny" aria-label="Alert {{.ID}}: noise">noise</button></form>{{end}}
