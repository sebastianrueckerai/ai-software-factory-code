{{template "head" .}}
<h2>New task</h2>
<form method="post" action="/tasks" class="newtask">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<p>Files an issue on the project's repository as you.</p>
<label for="project">Project</label>
<select id="project" name="project" required>
{{range .Projects}}<option value="{{.Name}}">{{.Name}} ({{.Repository}})</option>{{end}}
</select>
<label for="title">Title</label>
<input id="title" name="title" type="text" maxlength="255" required>
<label for="body">Description</label>
<textarea id="body" name="body" rows="10"></textarea>
<label for="lane">Lane</label>
<select id="lane" name="lane">
{{range .Lanes}}<option value="{{.Name}}" data-projects="{{.Projects}}"{{if eq .Name "ready"}} selected{{end}}>{{.Title}}</option>
{{end}}<option value="human">Human lane</option>
</select>
<label for="priority">Priority</label>
<select id="priority" name="priority">
<option value="">none</option>
{{range .Priorities}}<option value="{{.}}">{{.}}</option>{{end}}
</select>
<button type="submit">File the issue</button>
</form>
{{template "foot"}}
